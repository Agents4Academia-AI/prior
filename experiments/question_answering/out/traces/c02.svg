<text x="24" y="56" font-size="37.4" font-weight="700" fill="#212529">C02 · control-full-text</text>
<text x="24" y="84" font-size="24.8" fill="#495057">What score does the best agent get on PaperBench, on which subset, and how does it compare to the human PhD baseline?</text>
