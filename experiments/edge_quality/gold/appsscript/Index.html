<!DOCTYPE html>
<html>
<head>
<base target="_top">
<meta charset="utf-8">
<style>
:root{
  --bg:#faf6ec; --card:#fffdf7; --bd:#e4ddcc; --tx:#3b4252; --dim:#6b7686; --faint:#9aa0b0;
  --accent:#0a9396; --mark:#ffe9c7; --markTx:#8a5a12;
  --bg1:#4c6ef5; --bg2:#2f9e44; --bg3:#e8590c;
  --sans:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
  --mono:ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme:dark){
  :root{--bg:#1c1f26; --card:#242830; --bd:#39404d; --tx:#dbe0e8; --dim:#9aa3b2; --faint:#6b7280;
        --mark:#5a4415; --markTx:#ffd88a;}
}
*{box-sizing:border-box; -webkit-tap-highlight-color:transparent}
html,body{margin:0; background:var(--bg); color:var(--tx); font-family:var(--sans); font-size:16px}
body{padding-bottom:calc(230px + env(safe-area-inset-bottom))}

/* ── top bar ── */
.top{position:sticky; top:0; z-index:9; background:var(--bg); border-bottom:1px solid var(--bd);
     padding:8px 12px 6px}
.bar{height:4px; background:var(--bd); border-radius:3px; overflow:hidden; margin-bottom:6px}
.bar i{display:block; height:100%; background:var(--accent); width:0; transition:width .25s}
.meta{display:flex; align-items:center; gap:10px; font-size:12.5px; color:var(--dim)}
.meta b{color:var(--tx); font-weight:600}
.meta .sp{margin-left:auto; display:flex; gap:6px}
.tbtn{border:1px solid var(--bd); background:var(--card); color:var(--dim); border-radius:7px;
      padding:4px 9px; font-size:12px; cursor:pointer; font-family:var(--sans)}
.tbtn.on{border-color:var(--accent); color:var(--accent)}

/* ── card ── */
.wrap{padding:12px}
.card{background:var(--card); border:1px solid var(--bd); border-radius:12px; padding:14px; margin-bottom:10px}
.k{font-size:10px; text-transform:uppercase; letter-spacing:.8px; color:var(--faint); margin-bottom:3px}
.ttl{font-size:14.5px; font-weight:600; line-height:1.35}
.sub{font-size:12px; color:var(--dim); margin-top:2px}
.arrow{color:var(--faint); font-size:12px; margin:9px 0 7px; letter-spacing:1px}
.claim{font-size:15px; line-height:1.62; margin-top:4px; white-space:pre-wrap; word-break:break-word}
.claim mark{background:var(--mark); color:var(--markTx); font-weight:700; padding:1px 3px; border-radius:3px}
.claim .oth{color:var(--faint); font-weight:600}
details{border-top:1px solid var(--bd); margin-top:10px; padding-top:8px}
details summary{cursor:pointer; font-size:12.5px; color:var(--accent); list-style:none; user-select:none}
details summary::-webkit-details-marker{display:none}
details summary:before{content:"▸ "}
details[open] summary:before{content:"▾ "}
details .body{font-size:13.5px; line-height:1.55; color:var(--dim); margin-top:8px; white-space:pre-wrap}
.mono{font-family:var(--mono); font-size:11px; color:var(--faint); word-break:break-all; margin-top:8px}

/* ── dock ── */
.dock{position:fixed; left:0; right:0; bottom:0; z-index:10; background:var(--bg);
      border-top:1px solid var(--bd); padding:9px 12px calc(9px + env(safe-area-inset-bottom));
      max-height:78vh; overflow-y:auto}
.btn{display:block; width:100%; border:1.5px solid var(--bd); background:var(--card); color:var(--tx);
     border-radius:10px; padding:13px 12px; font-size:15px; font-weight:600; font-family:var(--sans);
     cursor:pointer; margin-bottom:7px; text-align:left; transition:.12s}
.btn .n{font-size:11px; color:var(--faint); font-weight:500; margin-left:6px}
.btn:active{transform:scale(.985)}
.btn[data-v=background].sel{border-color:var(--bg1); background:var(--bg1); color:#fff}
.btn[data-v=uses_extends].sel{border-color:var(--bg2); background:var(--bg2); color:#fff}
.btn[data-v=compares_contrasts].sel{border-color:var(--bg3); background:var(--bg3); color:#fff}
.btn.sel .n{color:rgba(255,255,255,.75)}
.row{display:flex; gap:7px; margin-bottom:7px}
.row .btn{margin-bottom:0; text-align:center; padding:10px 6px; font-size:13px}
.row .btn.sel{border-color:var(--accent); background:var(--accent); color:#fff}
.mini{display:flex; gap:7px}
.mini button{flex:1; border:1px solid var(--bd); background:var(--card); color:var(--dim);
             border-radius:9px; padding:10px; font-size:13px; cursor:pointer; font-family:var(--sans)}
.mini button.go{background:var(--accent); border-color:var(--accent); color:#fff; font-weight:600; flex:2}
.mini button:disabled{opacity:.4}
#extras{display:none; border-top:1px solid var(--bd); margin-top:2px; padding-top:8px}
#extras.open{display:block}
#extras .k{margin:2px 0 5px}
textarea{width:100%; border:1px solid var(--bd); background:var(--card); color:var(--tx);
         border-radius:9px; padding:9px; font-size:14px; font-family:var(--sans); resize:vertical; min-height:52px}
.toast{position:fixed; left:50%; transform:translateX(-50%); bottom:calc(250px + env(safe-area-inset-bottom));
       background:var(--tx); color:var(--bg); padding:8px 14px; border-radius:20px; font-size:13px;
       z-index:30; opacity:0; pointer-events:none; transition:opacity .2s}
.toast.show{opacity:.95}
.veil{position:fixed; inset:0; background:var(--bg); opacity:.6; z-index:20; display:none}
.veil.on{display:block}
.done{font-size:11.5px; color:var(--accent); margin-left:6px}
</style>
</head>
<body>

<div class="top">
  <div class="bar"><i id="prog"></i></div>
  <div class="meta">
    <span><b id="pDone">0</b> / <span id="pTotal">0</span> labelled</span>
    <span>·</span>
    <span>#<b id="pRank">—</b></span>
    <span id="pEdit" class="done"></span>
    <span class="sp">
      <button class="tbtn" id="bFast" onclick="toggleFast()">fast</button>
      <button class="tbtn" onclick="jump()">jump</button>
    </span>
  </div>
</div>

<div class="wrap">
  <div class="card">
    <div class="k">citing paper</div>
    <div class="ttl" id="cgT">…</div>
    <div class="sub" id="cgS"></div>
    <div class="arrow">│ cites ▼</div>
    <div class="k">cited paper</div>
    <div class="ttl" id="cdT">…</div>
    <div class="sub" id="cdS"></div>
    <div class="mono" id="ckey"></div>
  </div>

  <div class="card">
    <div class="k">claim context <span id="sIdx" style="text-transform:none;letter-spacing:0"></span></div>
    <div class="claim" id="claim">loading…</div>
    <details id="dCited"><summary>Cited paper abstract</summary><div class="body" id="cdA"></div></details>
    <details id="dCiting"><summary>Citing paper abstract</summary><div class="body" id="cgA"></div></details>
  </div>
</div>

<div class="dock">
  <button class="btn" data-v="background"         onclick="pick('intent','background')">background<span class="n">1</span></button>
  <button class="btn" data-v="uses_extends"       onclick="pick('intent','uses_extends')">uses_extends<span class="n">2</span></button>
  <button class="btn" data-v="compares_contrasts" onclick="pick('intent','compares_contrasts')">compares_contrasts<span class="n">3</span></button>

  <div id="extras">
    <div class="k">supports_claim</div>
    <div class="row">
      <button class="btn" data-a="support" data-v="supports"     onclick="pick('support','supports')">supports</button>
      <button class="btn" data-a="support" data-v="partial"      onclick="pick('support','partial')">partial</button>
      <button class="btn" data-a="support" data-v="does_not"     onclick="pick('support','does_not')">does_not</button>
      <button class="btn" data-a="support" data-v="inconclusive" onclick="pick('support','inconclusive')">inconcl.</button>
    </div>
    <div class="k">priority</div>
    <div class="row">
      <button class="btn" data-a="priority" data-v="obligatory" onclick="pick('priority','obligatory')">obligatory</button>
      <button class="btn" data-a="priority" data-v="helpful"    onclick="pick('priority','helpful')">helpful</button>
    </div>
    <div class="k">notes</div>
    <textarea id="notes" placeholder="why this was hard, which fork it hits…"></textarea>
  </div>

  <div class="mini" style="margin-bottom:7px">
    <button id="bExtras" onclick="toggleExtras()">+ all three</button>
    <button onclick="go(cur.rank-1)">← back</button>
    <button onclick="doSkip()">skip</button>
  </div>
  <div class="mini">
    <button class="go" id="bSave" onclick="save()">Save &amp; next</button>
  </div>
</div>

<div class="veil" id="veil"></div>
<div class="toast" id="toast"></div>

<script>
var cur = {rank:1}, sel = {intent:'', support:'', priority:''}, t0 = Date.now();
var fast = localStorage.getItem('fast') !== '0';
var busy = false;

function $(id){ return document.getElementById(id); }
function esc(s){ return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
function toast(m){ var t=$('toast'); t.textContent=m; t.className='toast show';
  setTimeout(function(){ t.className='toast'; }, 1600); }
function lock(on){ busy=on; $('veil').className = on?'veil on':'veil'; $('bSave').disabled=on; }
function fail(e){ lock(false); toast('⚠ ' + (e && e.message ? e.message : e)); }

function toggleFast(){ fast=!fast; localStorage.setItem('fast', fast?'1':'0'); paintFast(); }
function paintFast(){ $('bFast').className = fast ? 'tbtn on' : 'tbtn'; }

function toggleExtras(){
  var e=$('extras'), open = e.className !== 'open';
  e.className = open ? 'open' : '';
  $('bExtras').textContent = open ? '– intent only' : '+ all three';
  localStorage.setItem('extras', open?'1':'0');
}

function pick(axis, val){
  sel[axis] = (sel[axis] === val) ? '' : val;
  paintSel();
  // fast path: one tap = save + advance, but only when the extra axes aren't in play
  if (axis === 'intent' && sel[axis] && fast && $('extras').className !== 'open') save();
}

function paintSel(){
  var bs = document.querySelectorAll('.btn');
  for (var i=0;i<bs.length;i++){
    var b = bs[i], axis = b.getAttribute('data-a') || 'intent';
    b.className = (sel[axis] && sel[axis] === b.getAttribute('data-v')) ? 'btn sel' : 'btn';
  }
}

function renderClaim(txt){
  var h = esc(txt)
    .replace(/\[CITED:TARGET\]/g, '<mark>[THIS CITATION]</mark>')
    .replace(/\[CITED\]/g, '<span class="oth">[other]</span>');
  $('claim').innerHTML = h;
}

function render(d){
  cur = d; t0 = Date.now();
  sel = {intent: d.existing.intent === 'SKIP' ? '' : (d.existing.intent||''),
         support: d.existing.support||'', priority: d.existing.priority||''};
  $('notes').value = d.existing.notes || '';
  $('cgT').textContent = d.citing.title;
  $('cgS').textContent = [d.citing.year, d.citing.authors].filter(Boolean).join(' · ');
  $('cdT').textContent = d.cited.title;
  $('cdS').textContent = [d.cited.year, d.cited.authors].filter(Boolean).join(' · ');
  $('cgA').textContent = d.citing.abstract || '(none)';
  $('cdA').textContent = d.cited.abstract || '(none)';
  $('ckey').textContent = d.cite_key + '  ·  ' + d.site_key;
  $('sIdx').textContent = '(site ' + d.site_idx + ' of ' + d.n_sites + ' on this edge)';
  renderClaim(d.claim);
  $('dCited').open = false; $('dCiting').open = false;
  $('pRank').textContent = d.rank;
  $('pDone').textContent = d.state.labelled;
  $('pTotal').textContent = d.state.total;
  $('prog').style.width = (100 * d.state.labelled / d.state.total) + '%';
  $('pEdit').textContent = d.existing.intent
      ? (d.existing.intent === 'SKIP' ? '· skipped' : '· already labelled (editing)') : '';
  paintSel();
  window.scrollTo(0,0);
  lock(false);
}

function go(rank){
  if (busy || rank < 1) return;
  lock(true);
  google.script.run.withSuccessHandler(render).withFailureHandler(fail).getSite(rank);
}

function payload(){
  return {rank: cur.rank, site_key: cur.site_key, intent: sel.intent, support: sel.support,
          priority: sel.priority, notes: $('notes').value, seconds: (Date.now()-t0)/1000};
}

function save(){
  if (busy) return;
  if (!sel.intent){ toast('pick an intent first'); return; }
  lock(true);
  google.script.run.withSuccessHandler(render).withFailureHandler(fail).saveLabel(payload());
}

function doSkip(){
  if (busy) return;
  lock(true);
  google.script.run.withSuccessHandler(render).withFailureHandler(fail).skipSite(payload());
}

function jump(){
  var r = prompt('Jump to queue rank (1–' + ($('pTotal').textContent||'809') + '):', cur.rank);
  if (r) go(parseInt(r, 10));
}

document.addEventListener('keydown', function(e){
  if (e.target.tagName === 'TEXTAREA') return;
  if (e.key === '1') pick('intent','background');
  if (e.key === '2') pick('intent','uses_extends');
  if (e.key === '3') pick('intent','compares_contrasts');
  if (e.key === 'Enter') save();
  if (e.key === 'ArrowLeft') go(cur.rank - 1);
  if (e.key === 'ArrowRight') go(cur.rank + 1);
});

paintFast();
if (localStorage.getItem('extras') === '1') toggleExtras();
lock(true);
google.script.run.withSuccessHandler(function(st){
  google.script.run.withSuccessHandler(render).withFailureHandler(fail).getSite(st.firstOpen);
}).withFailureHandler(fail).getState();
</script>
</body>
</html>
